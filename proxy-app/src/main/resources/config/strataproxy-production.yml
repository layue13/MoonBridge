network:
  bind: "0.0.0.0:25577"
  workerThreads: 0
  nativeTransport: true
  maxFrameBytes: "16mb"
  connectTimeoutMillis: 3000
  writeBufferLow: "4mb"
  writeBufferHigh: "16mb"
  maxConnections: 20000
  maxConnectionsPerAddress: 300
  initialHandshakeTimeoutMillis: 5000

registry:
  staticServers: false
  persistenceEnabled: true
  persistencePath: "${STRATAPROXY_DATA_DIR:../data}/registry.json"
  healthCheckEnabled: true
  healthCheckInterval: "5s"
  healthCheckTimeout: "2s"

compression:
  mode: adaptive
  minThreshold: 256
  maxThreshold: 8192
  cpuGuard: 0.75
  rewriteEnabled: false
  rewriteMaxEventLoopDelayMillis: 25

packetAnalysis:
  largePayloadWarnBytes: "1mb"
  unknownChannelThrottleBytes: "256kb"
  moddedHandshakeWarnBytes: "2mb"
  customPayloadFloodMaxCount: 200
  customPayloadFloodWindow: "10s"

observability:
  prometheus: true
  packetTopN: 50
  anomalySampling: true
  flushIntervalSeconds: 5

admin:
  enabled: true
  bind: "127.0.0.1:8080"
  bearerToken: "${STRATAPROXY_ADMIN_TOKEN:}"
  tls:
    enabled: false
    keyStorePath: ""
    keyStorePassword: ""
    keyStoreType: "PKCS12"
    trustStorePath: ""
    trustStorePassword: ""
    trustStoreType: "PKCS12"
    clientAuth: false

servers: []
