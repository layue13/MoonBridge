network:
  bind: "0.0.0.0:25577"
  workerThreads: 0
  nativeTransport: true
  maxFrameBytes: "16mb"
  connectTimeoutMillis: 3000
  writeBufferLow: "4mb"
  writeBufferHigh: "16mb"
  maxConnections: 20000
  maxConnectionsPerAddress: 300
  # Admission rate limits are per proxy process. Raise for planned events; lower for public attack-prone listeners.
  maxNewConnectionsPerSecond: 3000
  maxNewConnectionsPerAddressPerSecond: 60
  initialHandshakeTimeoutMillis: 5000
  # Enable only behind a trusted HAProxy/Load Balancer that sends PROXY protocol v1.
  proxyProtocol: false

registry:
  staticServers: true
  persistenceEnabled: true
  persistencePath: "${STRATAPROXY_DATA_DIR:../data}/registry.json"
  healthCheckEnabled: true
  healthCheckInterval: "5s"
  healthCheckTimeout: "2s"
  # Use minecraft-status when backends should only receive traffic after a valid server-list response.
  healthCheckMode: "minecraft-status"

compression:
  mode: adaptive
  minThreshold: 256
  maxThreshold: 8192
  cpuGuard: 0.75
  rewriteEnabled: false
  rewriteMaxEventLoopDelayMillis: 25

observability:
  flushIntervalSeconds: 5

status:
  enabled: true
  motd: "StrataProxy"
  protocolName: "StrataProxy"
  protocolVersion: -1
  maxPlayers: 1000
  # Optional server-list icon. Use either a data:image/png;base64 URI or a PNG path relative to this config file.
  favicon: ""
  faviconPath: ""
  samplePlayers: []

auth:
  onlineMode: false
  rsaKeyBits: 1024
  verifyTokenBytes: 4
  sessionVerification: false
  sessionVerificationTimeout: "5s"

forwarding:
  # Supported modes: none, velocity-modern, bungee-legacy, bungee-guard.
  # velocity-modern and bungee-guard require a shared secret.
  mode: "none"
  secret: "${STRATAPROXY_FORWARDING_SECRET:}"

native:
  enabled: true
  autoDetect: true
  preferNativeTransport: true
  requireNativeTransport: false
  preferOpenSslTls: false
  preferNativeCompression: false
  disabledFeatures: []
  forcedFeatures: []

servers:
  - name: "lobby-1"
    address: "127.0.0.1:25565"
    tags: ["lobby"]
    capabilities: ["modern-forwarding"]
    protocolRange: "any"
    weight: 100
    softCapacity: 500
    hardCapacity: 600
    drainMode: false
    metadata:
      group: "lobby"
      host: "localhost"
