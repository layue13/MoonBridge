network:
  bind: "0.0.0.0:25577"
  workerThreads: 0
  nativeTransport: true
  maxFrameBytes: "8mb"
  connectTimeoutMillis: 5000
  writeBufferLow: "4mb"
  writeBufferHigh: "16mb"
  maxConnections: 10000
  maxConnectionsPerAddress: 200
  initialHandshakeTimeoutMillis: 5000

registry:
  staticServers: true
  persistenceEnabled: true
  persistencePath: "data/registry.json"
  healthCheckEnabled: true
  healthCheckInterval: "5s"
  healthCheckTimeout: "2s"

compression:
  mode: adaptive
  minThreshold: 256
  maxThreshold: 8192
  cpuGuard: 0.75
  rewriteEnabled: false
  rewriteMaxEventLoopDelayMillis: 25

packetAnalysis:
  largePayloadWarnBytes: "1mb"
  unknownChannelThrottleBytes: "256kb"
  moddedHandshakeWarnBytes: "2mb"
  customPayloadFloodMaxCount: 200
  customPayloadFloodWindow: "10s"

observability:
  prometheus: true
  packetTopN: 50
  anomalySampling: true
  flushIntervalSeconds: 5

auth:
  onlineMode: false
  rsaKeyBits: 1024
  verifyTokenBytes: 4
  sessionVerification: false

native:
  enabled: true
  autoDetect: true
  preferNativeTransport: true
  requireNativeTransport: false
  preferOpenSslTls: false
  preferNativeCompression: false
  disabledFeatures: []
  forcedFeatures: []

admin:
  enabled: true
  bind: "127.0.0.1:8080"
  # Empty means unauthenticated admin API. Set a strong token before exposing beyond localhost.
  bearerToken: ""
  tls:
    enabled: false
    keyStorePath: ""
    keyStorePassword: ""
    keyStoreType: "PKCS12"
    trustStorePath: ""
    trustStorePassword: ""
    trustStoreType: "PKCS12"
    clientAuth: false

servers:
  - name: "lobby-1"
    address: "127.0.0.1:25565"
    tags: ["lobby"]
    capabilities: ["modern-forwarding"]
    protocolRange: "any"
    weight: 100
    softCapacity: 500
    hardCapacity: 600
    drainMode: false
    metadata:
      group: "lobby"
      host: "localhost"
