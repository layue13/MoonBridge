proxy:
  host: "127.0.0.1"
  port: 25578
  # Must match proxy backendAgent.sharedSecret. Generate a random value with at least 32 characters.
  sharedSecret: "replace-with-a-random-secret"

backend:
  name: "survival-1"
  address: "127.0.0.1:25565"
  tags: ["survival"]
  capabilities: []
  protocolName: "any"
  minProtocol: 0
  maxProtocol: 2147483647
  weight: 100
  softCapacity: 0
  hardCapacity: 0
  drainMode: false
  persistent: false
  metadata:
    group: "survival"

# The proxy removes this backend after backendAgent.heartbeatTimeout if it stops receiving heartbeats.
heartbeatSeconds: 10
# When true, disable/restart unregisters immediately rather than waiting for lease expiry.
unregisterOnDisable: true
