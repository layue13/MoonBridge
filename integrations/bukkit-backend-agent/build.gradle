plugins {
    id 'java'
    id 'maven-publish'
}

group = 'uk.potatolab'
version = System.getenv('GITHUB_SHA')?.take(7) ?: '0.2.0-SNAPSHOT'

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    mavenCentral()
}

dependencies {
    // The implementation deliberately uses only API methods already present in Bukkit 1.7.10.
    compileOnly('org.spigotmc:spigot-api:1.8-R0.1-SNAPSHOT') {
        // This historical snapshot declares a now-unavailable chat artifact.
        // The backend agent does not use Bukkit chat APIs.
        exclude group: 'net.md-5', module: 'bungeecord-chat'
    }
}

sourceSets {
    main {
        java {
            // Bundle the platform-neutral contract so dependent Bukkit plugins
            // resolve one shared API class from this agent plugin.
            srcDir '../../backend-agent-api/src/main/java'
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'strataproxy-bukkit-backend-agent'
}

publishing {
    publications {
        bukkitAgent(MavenPublication) {
            from components.java
            artifactId = 'strataproxy-bukkit-backend-agent'
        }
    }
    repositories {
        maven {
            name = 'giteaPackages'
            url = uri(System.getenv('MAVEN_URL') ?: 'https://git.nest.potatolab.uk:8443/api/packages/layue13/maven')
            credentials {
                username = System.getenv('MAVEN_USER') ?: 'NONE'
                password = System.getenv('MAVEN_PASSWORD') ?: 'NONE'
            }
        }
    }
}
