listen: "127.0.0.1:25577"
authentication: OFFLINE
maxConnections: 4096
# transport: AUTO # AUTO picks epoll on Linux, kqueue on macOS, NIO elsewhere; NIO, EPOLL or KQUEUE force one.
status:
  motd: "MoonBridge"
  maxPlayers: 100
  # icon: "server-icon.png" # Optional 64x64 PNG, relative to this config (maximum 64 KiB).
initialRouting:
  servers: ["lobby"] # Used only when no placement plugin is installed; order is the retry order.
  timeoutSeconds: 15
plugins:
  directory: "../plugins"
  eventTimeoutSeconds: 5
  enabled: {}
  # To enable the bundled native LuckPerms platform, replace the empty map above:
  # enabled:
  #   dev.moonbridge.luckperms.LuckPermsMoonBridgePlugin:
  #     proxy-id: "proxy-1"
backends:
  - name: "lobby"
    address: "127.0.0.1:25565"
    tags:
      role: "lobby"
