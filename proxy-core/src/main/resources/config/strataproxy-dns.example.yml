# Example: enable the DNS plugin instead of configured static backends.
# Replace the host with a DNS name that resolves to your backend nodes.
listen: "127.0.0.1:25577"
authentication: OFFLINE
maxConnections: 4096
status:
  motd: "StrataProxy"
  maxPlayers: 100
  # icon: "server-icon.png" # Optional 64x64 PNG, relative to this config (maximum 64 KiB).
backends: []
plugins:
  directory: "../plugins"
  initialPlacementTimeoutSeconds: 15
  eventTimeoutSeconds: 5
  enabled:
    dev.strataproxy.plugins.dns.DnsDiscoveryPlugin:
      host: "backends.example.net"
      port: "25565"
      namePrefix: "discovered"
      refreshSeconds: "30"
