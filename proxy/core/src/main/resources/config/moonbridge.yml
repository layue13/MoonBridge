listen: "127.0.0.1:25577"
authentication: OFFLINE
maxConnections: 4096
# transport: AUTO # AUTO picks epoll on Linux, kqueue on macOS, NIO elsewhere; NIO, EPOLL or KQUEUE force one.
# Optional: also accept players over WebSocket (e.g. behind a CDN) next to the TCP listener above.
# Clients need the MoonBridge WebSocket client mod and connect to ws://host:port/path or wss://host/path.
# websocket:
#   listen: "127.0.0.1:8080"
#   path: "/mc"
#   # tls: { certificateChain: "certs/fullchain.pem", privateKey: "certs/privkey.pem" } # PEM, PKCS#8 key; omit when the CDN or a reverse proxy terminates TLS
#   trustedProxies: ["127.0.0.1"] # only these peers may supply the player IP header; add your CDN's published ranges
#   realIpHeader: "X-Forwarded-For" # or CF-Connecting-IP / X-Real-IP
#   handshakeTimeoutSeconds: 10
# logging:
#   playerAddresses: true # false writes [hidden] instead of player IPs in logs/latest.log; see docs/logging.md
status:
  motd: "MoonBridge"
  maxPlayers: 100
  # icon: "server-icon.png" # Optional 64x64 PNG, relative to this config (maximum 64 KiB).
initialRouting:
  servers: ["lobby"] # Used only when no placement plugin is installed; order is the retry order.
  timeoutSeconds: 15
plugins:
  directory: "../plugins"
  eventTimeoutSeconds: 5
  enabled: {}
  # To enable the bundled native LuckPerms platform, replace the empty map above:
  # enabled:
  #   dev.moonbridge.luckperms.LuckPermsMoonBridgePlugin:
  #     proxy-id: "proxy-1"
backends:
  - name: "lobby"
    address: "127.0.0.1:25565"
    tags:
      role: "lobby"
