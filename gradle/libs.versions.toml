[versions]
junit = "5.14.1"
netty = "4.2.2.Final"
jackson = "2.20.0"
picocli = "4.7.7"
zstd-jni = "1.5.7-11"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-transport-classes-epoll = { module = "io.netty:netty-transport-classes-epoll", version.ref = "netty" }
netty-transport-classes-kqueue = { module = "io.netty:netty-transport-classes-kqueue", version.ref = "netty" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
cli-picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
